name: Release

# Plan P4-C / Constitution Art. 9: a release is a semver tag on `main`.
#   1. merge develop -> main (CI green)
#   2. git tag vX.Y.Z on the merge commit && git push origin vX.Y.Z
# This workflow then re-runs the full CI gate, builds with uv (DD-008), installs
# the wheel in a clean venv, and publishes to PyPI with trusted publishing (OIDC):
# no API token is stored in the repository.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag matches pyproject version
        id: version
        run: |
          declared=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag v$tag does not match pyproject version $declared"; exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - name: Tag points at main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main — releases are cut from main only"; exit 1
          fi

      - name: CHANGELOG has an entry for this version
        run: |
          grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [${{ steps.version.outputs.version }}] section"; exit 1; }

  ci:
    name: CI gate
    needs: verify
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build distributions
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Build sdist and wheel
        run: uv build

      # T-023 Done criterion: the wheel installs and imports in a clean venv.
      - name: Smoke-test the wheel in a clean venv
        run: |
          uv venv "$RUNNER_TEMP/smoke" --python 3.12
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "
          import reflex_react_flow as rxf
          assert rxf.__version__ == '${{ needs.verify.outputs.version }}', rxf.__version__
          print('reflex-react-flow', rxf.__version__, 'imports OK')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-react-flow/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease
