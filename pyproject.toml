[project]
name = "reflex-react-flow"
version = "0.0.1"
description = "Node-based editors and flow diagrams for Reflex, powered by React Flow (@xyflow/react) v12. Pure Python, no JavaScript."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "react-flow",
    "xyflow",
    "node-editor",
    "flow-chart",
    "graph-visualization",
    "diagrams",
    "langgraph",
    "custom-component",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Widget Sets",
    "Typing :: Typed",
]

# Constitution Art. 2 (as amended A-2026-08-08-01): runtime deps must be
# MIT, Apache-2.0, or BSD-permissive (BSD-2/BSD-3, ISC).
#   reflex   -> Apache-2.0
#   networkx -> BSD-3-Clause
dependencies = [
    "reflex>=0.9.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
# langgraph -> MIT. Adapter only, isolated behind an import guard (REQ-036).
langgraph = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-react-flow"
Repository = "https://github.com/ecrespo/reflex-react-flow"
Issues = "https://github.com/ecrespo/reflex-react-flow/issues"
Changelog = "https://github.com/ecrespo/reflex-react-flow/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/reflex_react_flow"]

[tool.hatch.build.targets.sdist]
include = [
    "custom_components/",
    "specs/",
    "tests/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

# --- dev tooling (uv-managed, DD-008) -------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "pytest-playwright>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `specs/` is normative and changes only via the SDD process (Constitution Art. 9) —
# the formatter must not rewrite the code samples inside those documents.
extend-exclude = [".web", "flow_demo/.web", "specs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # flake8-simplify (DRY / readability)
    "RUF",
    "D",    # pydocstyle — public API is documented (Art. 5)
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100", "D104"]
# Reflex state classes declare mutable defaults by design — the framework
# deep-copies them per session, so RUF012's ClassVar advice does not apply.
"flow_demo/*" = ["D100", "D103", "D104", "RUF012"]
"**/state.py" = ["RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["flow_demo"]
markers = [
    "phase1: Phase 1 (Layer 1 wrapper) integration tests",
    "phase2: Phase 2 (Layer 2 registry) integration tests",
    "phase3: Phase 3 (Layer 3 state/layouts) tests",
    "integration: requires a running demo app / browser",
]
filterwarnings = ["ignore::DeprecationWarning:pydantic.*"]
